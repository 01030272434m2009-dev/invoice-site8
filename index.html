<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الوصول - الصيدلية البيطرية الفاخرة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-light: #f8f9fa;
            --card-white: #ffffff;
            --accent-gold: #c5a028;
            --text-dark: #1a1a1a;
            --text-muted: #6c757d;
            --border-light: #e9ecef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            background-color: var(--card-white);
            border: 1px solid var(--border-light);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            position: relative;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background-color: var(--accent-gold);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .auth-header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            color: var(--accent-gold);
            border-bottom: 2px solid var(--accent-gold);
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .auth-form.active {
            display: flex;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-light);
            background-color: #fff;
            color: var(--text-dark);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent-gold);
        }

        .btn-submit {
            background-color: transparent;
            color: var(--text-dark);
            border: 2px solid var(--text-dark);
            padding: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            text-align: center;
        }

        .btn-submit:hover {
            background-color: var(--accent-gold);
            border-color: var(--accent-gold);
            color: #fff;
        }

        .form-footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 15px;
        }

        .form-footer a {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h1>الصيدلية البيطرية الفاخرة 🐾</h1>
            <p>بوابة الخدمات والعلاجات الطبية المتكاملة</p>
        </div>

        <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
            <button class="tab-btn" onclick="switchTab('register')">إنشاء حساب جديد</button>
        </div>

        <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>اسم المستخدم أو البريد الإلكتروني</label>
                <input type="text" id="loginUser" required placeholder="أدخل اسم المستخدم..." oninput="checkSecretCode(this.value)">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPass" required placeholder="أدخل كلمة المرور...">
            </div>
            <button type="submit" class="btn-submit">دخول الحساب</button>
            <div class="form-footer">
                ليس لديك حساب؟ <a href="#" onclick="switchTab('register'); return false;">سجل الآن مجاناً</a>
            </div>
        </form>

        <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" id="regName" required placeholder="مثال: د. أحمد محمد">
            </div>
            <div class="form-group">
                <label>اسم المستخدم (بالإنجليزي)</label>
                <input type="text" id="regUser" required placeholder="مثال: vet_user1">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="regPass" required placeholder="أدخل كلمة مرور قوية...">
            </div>
            <button type="submit" class="btn-submit">تأكيد وإنشاء الحساب</button>
            <div class="form-footer">
                لديك حساب بالفعل؟ <a href="#" onclick="switchTab('login'); return false;">تسجيل الدخول</a>
            </div>
        </form>
    </div>

    <script>
        // الرمز السري الفائق لدخول الإدارة مباشرة
        const SECRET_ADMIN_CODE = "VET999ADMIN";

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('user_logged_in') === 'true') {
                window.location.href = 'store.html';
            }
        });

        // دالة الفحص السري الفوري أثناء الكتابة
        function checkSecretCode(value) {
            if (value.trim() === SECRET_ADMIN_CODE) {
                // تصفير الحقل لمنع كشفه وإعادة التوجيه فوراً لصفحة التحكم المخصصة
                document.getElementById('loginUser').value = "";
                alert("مرحباً بك في النظام السري للإدارة.. جاري فتح لوحة التحكم.");
                window.location.href = 'admin_dashboard.html'; 
            }
        }

        function switchTab(tabName) {
            const tabs = document.querySelectorAll('.tab-btn');
            const forms = document.querySelectorAll('.auth-form');

            tabs.forEach(tab => tab.classList.remove('active'));
            forms.forEach(form => form.classList.remove('active'));

            if (tabName === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;

            let accounts = JSON.parse(localStorage.getItem('pharmacy_accounts')) || [
                { username: "admin", password: "123" }
            ];

            const foundAccount = accounts.find(acc => acc.username === user && acc.password === pass);

            if (foundAccount) {
                localStorage.setItem('user_logged_in', 'true');
                localStorage.setItem('current_user_name', user);
                alert("تم تسجيل الدخول بنجاح! جاري تحويلك للمتجر...");
                window.location.href = 'store.html';
            } else {
                alert("خطأ: اسم المستخدم أو كلمة المرور غير صحيحة!");
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const user = document.getElementById('regUser').value.trim();
            const pass = document.getElementById('regPass').value;

            let accounts = JSON.parse(localStorage.getItem('pharmacy_accounts')) || [
                { username: "admin", password: "123" }
            ];

            const isExist = accounts.some(acc => acc.username === user);
            if (isExist) {
                alert("اسم المستخدم هذا مسجل بالفعل، يرجى اختيار اسم آخر.");
                return;
            }

            accounts.push({ name: name, username: user, password: pass });
            localStorage.setItem('pharmacy_accounts', JSON.stringify(accounts));

            alert("تم إنشاء حسابك البيطري بنجاح! يمكنك الآن تسجيل الدخول.");
            switchTab('login');
        }
    </script>
</body>
</html>
