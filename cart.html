<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات والإنهاء - الصيدلية البيطرية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --accent-gold: #c5a059;
            --accent-blue: #1e3a8a;
            --text-color: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 50px; }
        
        .navbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }
        .navbar a { color: var(--text-color); text-decoration: none; margin-right: 15px; font-weight: 600; transition: 0.3s; }
        .navbar a:hover { color: var(--accent-gold); }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 1.8rem; margin-bottom: 25px; color: var(--accent-blue); border-bottom: 3px solid var(--accent-gold); padding-bottom: 10px; display: inline-block; }

        .main-wrapper { display: flex; flex-direction: column; gap: 30px; }
        @media (min-width: 992px) { .main-wrapper { flex-direction: row; align-items: flex-start; } }

        .left-side { flex: 2; display: flex; flex-direction: column; gap: 25px; }
        .right-side { flex: 1; background-color: var(--card-bg); border: 1px solid var(--border-color); padding: 25px; position: sticky; top: 20px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.04); }

        .section-box { background-color: var(--card-bg); border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.04); }
        .box-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; color: var(--accent-blue); border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }

        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #f1f5f9; }
        .cart-item:last-child { border-bottom: none; }
        .item-info { flex: 2; }
        .item-info div:first-child { font-weight: 600; color: #1e293b; }
        .item-price { color: var(--accent-gold); font-weight: bold; margin-top: 5px; }
        .qty-controls { display: flex; align-items: center; gap: 12px; background: #f8fafc; border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 8px; }
        .qty-btn { background: none; border: none; color: var(--accent-blue); font-size: 1.2rem; cursor: pointer; width: 25px; font-weight: 700; }
        .delete-btn { background: none; border: 1px solid var(--danger-color); color: var(--danger-color); cursor: pointer; font-size: 0.85rem; padding: 5px 12px; margin-right: 15px; border-radius: 6px; font-weight: 600; transition: 0.3s; }
        .delete-btn:hover { background: var(--danger-color); color: #fff; }

        .form-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 600px) { .form-grid { grid-template-columns: 1fr 1fr; } }
        .full-width { grid-column: span 1; }
        @media (min-width: 600px) { .full-width { grid-column: span 2; } }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.9rem; font-weight: 700; color: #475569; }
        .form-group input, .form-group select { background-color: #f8fafc; border: 1px solid var(--border-color); color: #1e293b; padding: 12px; outline: none; font-size: 0.95rem; border-radius: 8px; transition: 0.3s; }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent-gold); background-color: #fff; box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.1); }

        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 1rem; color: #475569; }
        .summary-row.total { border-top: 2px dashed var(--border-color); padding-top: 25px; font-size: 1.3rem; font-weight: bold; color: var(--accent-blue); }
        
        .coupon-box { display: flex; gap: 10px; margin-top: 8px; margin-bottom: 20px; }
        .coupon-box input { flex: 2; }
        .btn-coupon { flex: 1; background: #f1f5f9; border: 1px solid var(--border-color); color: var(--text-color); cursor: pointer; font-weight: 600; border-radius: 8px; transition: 0.3s; }
        .btn-coupon:hover { background: var(--accent-gold); color: #fff; border-color: var(--accent-gold); }

        .btn-submit { width: 100%; background: var(--accent-blue); border: none; color: #ffffff; padding: 14px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2); }
        .btn-submit:hover { background: var(--accent-gold); transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(197, 160, 89, 0.3); }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-weight:700; color:var(--accent-blue); font-size: 1.2rem;">الصيدلية البيطرية الفاخرة 🐾</div>
        <div>
            <a href="store.html">المتجر</a>
            <a href="cart.html">السلة</a>
        </div>
    </nav>

    <div class="container">
        <h1>مراجعة وإنهاء الطلب</h1>

        <div class="main-wrapper">
            
            <div class="left-side">
                
                <div class="section-box">
                    <div class="box-title">الأدوية المحددة بالسلة</div>
                    <div id="cartItemsList"></div>
                </div>

                <div class="section-box">
                    <div class="box-title">بيانات العميل والاتصال</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>الاسم الكامل للطبيب/المربي *</label>
                            <input type="text" id="custName" required placeholder="اكتب الاسم ثلاثي">
                        </div>
                        <div class="form-group">
                            <label>رقم الهاتف الأساسي (عليه واتساب) *</label>
                            <input type="tel" id="custPhone1" required placeholder="01xxxxxxxxx">
                        </div>
                        <div class="form-group">
                            <label>رقم هاتف احتياطي (للطوارئ) *</label>
                            <input type="tel" id="custPhone2" required placeholder="01xxxxxxxxx">
                        </div>
                        <div class="form-group">
                            <label>تاريخ وموعد الاستلام المفضل *</label>
                            <select id="deliveryTime" onchange="calculateFinalTotal()">
                                <option value="صباحاً (10 ص - 3 ظهراً)">صباحاً (10 ص - 3 ظهراً) - شحن عادي</option>
                                <option value="مساءً (6 مساءً - 11 مساءً) [+15 ج.م]">مساءً (6 مساءً - 11 مساءً) - شحن سريع (+15 ج.م)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="section-box">
                    <div class="box-title">عنوان الشحن والتوصيل</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>المحافظة *</label>
                            <select id="govSelect" onchange="updateCities()">
                                <option value="">اختر المحافظة...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>المدينة / المركز *</label>
                            <select id="citySelect" onchange="handleCityChange()">
                                <option value="">اختر المدينة بعد المحافظة...</option>
                            </select>
                            <input type="text" id="customCityInput" oninput="calculateFinalTotal()" placeholder="اكتب اسم المدينة إذا لم تجدها" style="display:none; margin-top:10px;">
                        </div>
                        <div class="form-group full-width">
                            <label>اسم الحي / الشارع / القرية وتفاصيل مكان الصيدلية أو المزرعة *</label>
                            <input type="text" id="addressDetails" required placeholder="مثال: شارع المحطة، بجوار مسجد التقوى، مزرعة الأمل">
                        </div>
                    </div>
                </div>

            </div>

            <div class="right-side">
                <div class="box-title">ملخص الحساب والفاتورة</div>
                
                <div class="summary-row">
                    <span>إجمالي الأدوية:</span>
                    <span id="subTotal" style="font-weight: 600; color: #1e293b;">0 ج.م</span>
                </div>
                <div class="summary-row">
                    <span>شركة الشحن المعتمدة:</span>
                    <span id="shippingCompany" style="color:var(--accent-gold); font-weight:700;">البريد السريع البيطري</span>
                </div>
                <div class="summary-row">
                    <span>تكلفة التوصيل الشحن:</span>
                    <span id="shippingCost" style="font-weight: 600; color: #1e293b;">0 ج.م</span>
                </div>
                <div class="summary-row" id="discountRow" style="display:none; color:var(--success-color); font-weight: 600;">
                    <span>خصم الكوبون:</span>
                    <span id="discountValue">-0 ج.م</span>
                </div>

                <label style="font-size:0.85rem; display:block; margin-bottom:5px; font-weight: 600; color: #475569;">هل لديك كود خصم؟</label>
                <div class="coupon-box">
                    <input type="text" id="couponInput" placeholder="اكتب كود الخصم هنا">
                    <button class="btn-coupon" onclick="applyCoupon()">تطبيق</button>
                </div>

                <div class="summary-row total">
                    <span>الإجمالي الكلي:</span>
                    <span id="finalTotal">0 ج.م</span>
                </div>

                <button class="btn-submit" id="btnSubmitOrder" onclick="submitOrder()">تأكيد وإرسال الطلب</button>
            </div>

        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIIQFvZ1GvVLWWvWFxEmLwP4ksgXbXO5K8As9PxCh2sIysTkLYVtvu7-WwirC-5NhiJw/exec";
        
        let serverCoupons = [];
        let serverShippingConfig = [];
        let couponDiscount = 0;
        let cart = JSON.parse(localStorage.getItem('pharmacy_cart')) || [];

        const localShippingRates = {
            "القاهرة": { cost: 40, cities: ["مدينة نصر", "مصر الجديدة", "المعادي", "حلوان", "شبرا", "التجمع الخامس", "وسط البلد", "الزيتون", "عين شمس", "المرج"] },
            "الجيزة": { cost: 45, cities: ["الدقي", "المهندسين", "الهرم", "فيصل", "6 أكتوبر", "الشيخ زايد", "العجوزة", "إمبابة", "البدرشين", "العياط"] },
            "الإسكندرية": { cost: 60, cities: ["سموحة", "المنتزه", "محرم بك", "العجمي", "برج العرب", "سيدي جابر", "السيوف", "العصافرة"] },
            "القليوبية": { cost: 50, cities: ["بنها", "شبرا الخيمة", "قليوب", "الخانكة", "قناطر الخيرية", "طوخ", "كفر شكر"] },
            "المنوفية": { cost: 55, cities: ["شبين الكوم", "منوف", "أشمون", "السادات", "باجور", "قويسنا", "تلا", "بركة السبع"] },
            "الغربية": { cost: 55, cities: ["طنطا", "المحلة الكبرى", "كفر الزيات", "زفتى", "السنطة", "بسيون", "قطور", "سمنود"] },
            "الدقهلية": { cost: 60, cities: ["المنصورة", "ميت غمر", "السنبلاوين", "طلخا", "دكرنس", "بلقاس", "منزلة", "شربين"] },
            "الشرقية": { cost: 60, cities: ["الزقازيق", "العاشر من رمضان", "بلبيس", "فاقوس", "أبو حماد", "أبو كبير", "الحسينية", "منيا القمح"] },
            "دمياط": { cost: 65, cities: ["دمياط", "دمياط الجديدة", "رأس البر", "فارسكور", "الزرقا", "كفر سعد"] },
            "كفر الشيخ": { cost: 60, cities: ["كفر الشيخ", "دسوق", "قلين", "سيدي سالم", "بلطيم", "الحامول", "فوه", "مطوبس"] },
            "البحيرة": { cost: 60, cities: ["دمنهور", "كفر الدوار", "رشيد", "إدكو", "أبو حمص", "إيتاي البارود", "كوم حمادة", "حوش عيسى"] },
            "الإسماعيلية": { cost: 60, cities: ["الإسماعيلية", "القصاصين", "التل الكبير", "القنطرة شرق", "القنطرة غرب", "فايد"] },
            "بورسعيد": { cost: 65, cities: ["بورفؤاد", "حي الشرق", "حي العرب", "حي الضواحي", "حي المناخ"] },
            "السويس": { cost: 65, cities: ["حي السويس", "حي الأربعين", "حي الجناين", "حي عتاقة", "حي فيصل"] },
            "الفيوم": { cost: 60, cities: ["الفيوم", "إطسا", "سنورس", "طامية", "يوسف الصديق", "أبشواي"] },
            "بني سويف": { cost: 60, cities: ["بني سويف", "الواسطى", "ناصر", "ببا", "الفشن", "سمسطا", "اهناسيا"] },
            "المنيا": { cost: 65, cities: ["المنيا", "ملوي", "بني مزار", "مغاغة", "سمالوط", "أبو قرقاص", "دير مواس"] },
            "أسيوط": { cost: 70, cities: ["أسيوط", "ديروط", "منفلوط", "القوصية", "أبو تيج", "أبنوب", "صدفا", "الغنايم"] },
            "سوهاج": { cost: 75, cities: ["سوهاج", "أخميم", "طما", "طهطا", "المنشأة", "جرجا", "البلينا", "المراغة"] },
            "قنا": { cost: 80, cities: ["قنا", "نجع حمادي", "دشنا", "قوص", "أبو تشت", "قفط", "نقادة", "فرشوط"] },
            "الأقصر": { cost: 85, cities: ["الأقصر", "إسنا", "أرمنت", "القرنة", "الطود"] },
            "أسوان": { cost: 90, cities: ["أسوان", "كوم أمبو", "إدفو", "نصر النوبة", "أبو سمبل"] },
            "البحر الأحمر": { cost: 90, cities: ["الغردقة", "سفاجا", "القصير", "مرسى علم", "رأس غارب", "شلاتين"] },
            "الوادى الجديد": { cost: 90, cities: ["الخارجة", "الداخلة", "الفرافرة", "باريس", "بلاط"] },
            "مطروح": { cost: 80, cities: ["مرسى مطروح", "العلمين", "الضبعة", "سيوة", "الحمام", "السلوم"] },
            "شمال سيناء": { cost: 85, cities: ["العريش", "بئر العبد", "الشيخ زويد", "رفح"] },
            "جنوب سيناء": { cost: 85, cities: ["شرم الشيخ", "الطور", "دهب", "نويبع", "رأس سدر", "سانت كاترين"] }
        };

        function loadServerConfig() {
            fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                if (data.coupons) serverCoupons = data.coupons;
                if (data.shippingConfig) serverShippingConfig = data.shippingConfig;
                calculateFinalTotal();
            })
            .catch(err => console.log("تحذير: جاري العمل بالإعدادات المحلية الاحتياطية."));
        }

        function initGovernates() {
            const govSelect = document.getElementById('govSelect');
            for (let gov in localShippingRates) {
                govSelect.innerHTML += `<option value="${gov}">${gov}</option>`;
            }
        }

        function renderCartItems() {
            const container = document.getElementById('cartItemsList');
            container.innerHTML = '';
            if(cart.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); font-weight:600;">السلة فارغة حالياً.</p>';
                return;
            }
            cart.forEach(item => {
                container.innerHTML += `
                    <div class="cart-item">
                        <div class="item-info">
                            <div>${item.name}</div>
                            <div class="item-price">${item.price} ج.م</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                            <span>${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                        </div>
                        <button class="delete-btn" onclick="removeItem(${item.id})">حذف</button>
                    </div>
                `;
            });
            calculateFinalTotal();
        }

        function updateQty(id, change) {
            let item = cart.find(p => p.id === id);
            if(item) {
                item.quantity += change;
                if(item.quantity <= 0) cart = cart.filter(p => p.id !== id);
                localStorage.setItem('pharmacy_cart', JSON.stringify(cart));
                renderCartItems();
            }
        }

        function removeItem(id) {
            cart = cart.filter(p => p.id !== id);
            localStorage.setItem('pharmacy_cart', JSON.stringify(cart));
            renderCartItems();
        }

        function updateCities() {
            const gov = document.getElementById('govSelect').value;
            const citySelect = document.getElementById('citySelect');
            const customInput = document.getElementById('customCityInput');
            
            citySelect.innerHTML = '<option value="">اختر المدينة...</option>';
            customInput.style.display = 'none';

            if(gov && localShippingRates[gov]) {
                localShippingRates[gov].cities.forEach(city => {
                    citySelect.innerHTML += `<option value="${city}">${city}</option>`;
                });
                citySelect.innerHTML += `<option value="other">أخرى (كتابة اسم المدينة)...</option>`;
            }
            calculateFinalTotal();
        }

        function handleCityChange() {
            const citySelect = document.getElementById('citySelect').value;
            const customInput = document.getElementById('customCityInput');
            if(citySelect === 'other') {
                customInput.style.display = 'block';
            } else {
                customInput.style.display = 'none';
            }
            calculateFinalTotal();
        }

        function applyCoupon() {
            const inputCode = document.getElementById('couponInput').value.trim().toUpperCase();
            if(!inputCode) return alert("يرجى كتابة الكود أولاً!");

            let matchedCoupon = serverCoupons.find(c => c.code.toUpperCase() === inputCode || c.Coupon_Code === inputCode);
            
            if(matchedCoupon) {
                let percentage = matchedCoupon.discountPercentage || matchedCoupon.Discount_Percentage;
                couponDiscount = parseFloat(percentage);
                alert(`تم تطبيق الكوبون بنجاح! خصم ${couponDiscount * 100}% على المنتجات.`);
            } else if (inputCode === "VET20") { 
                couponDiscount = 0.20;
                alert("تم تطبيق الكوبون الافتراضي بنجاح! خصم 20%.");
            } else {
                alert("كوبون الخصم غير صحيح أو منتهي.");
                couponDiscount = 0;
            }
            calculateFinalTotal();
        }

        function calculateFinalTotal() {
            let itemsSubtotal = 0;
            cart.forEach(item => itemsSubtotal += (item.price * item.quantity));
            
            const gov = document.getElementById('govSelect').value;
            let city = document.getElementById('citySelect').value;
            if(city === 'other') city = document.getElementById('customCityInput').value.trim();

            let shipping = 0;
            let company = "البريد السريع البيطري"; 

            if(gov && city) {
                let serverMatch = serverShippingConfig.find(s => 
                    (s.governorate && s.governorate.trim() === gov.trim() && s.city && s.city.trim() === city.trim()) ||
                    (s.Governorate && s.Governorate.trim() === gov.trim() && s.City && s.City.trim() === city.trim())
                );
                
                if(serverMatch) {
                    shipping = parseFloat(serverMatch.shippingCost || serverMatch.Shipping_Cost);
                    company = serverMatch.companyName || serverMatch.Company_Name;
                } else if(localShippingRates[gov]) {
                    shipping = localShippingRates[gov].cost;
                }
            } else if(gov && !city) {
                if(localShippingRates[gov]) shipping = localShippingRates[gov].cost;
            }

            const timeSlot = document.getElementById('deliveryTime').value;
            if(timeSlot.includes('مساءً') && gov !== "") {
                shipping += 15; 
            }

            let discountAmount = itemsSubtotal * couponDiscount;
            let final = (itemsSubtotal - discountAmount) + shipping;

            document.getElementById('subTotal').innerText = itemsSubtotal + " ج.م";
            document.getElementById('shippingCost').innerText = shipping + " ج.م";
            document.getElementById('shippingCompany').innerText = company;
            
            if(discountAmount > 0) {
                document.getElementById('discountRow').style.display = 'flex';
                document.getElementById('discountValue').innerText = `-${discountAmount} ج.م`;
            } else {
                document.getElementById('discountRow').style.display = 'none';
            }
            
            document.getElementById('finalTotal').innerText = final + " ج.م";
        }

    function submitOrder() {
    if(cart.length === 0) { alert("السلة فارغة!"); return; }
    
    const name = document.getElementById('custName').value.trim();
    const p1 = document.getElementById('custPhone1').value.trim();
    const p2 = document.getElementById('custPhone2').value.trim();
    const gov = document.getElementById('govSelect').value;
    let city = document.getElementById('citySelect').value;
    const address = document.getElementById('addressDetails').value.trim();
    const deliveryTime = document.getElementById('deliveryTime').value;

    if(city === 'other') city = document.getElementById('customCityInput').value.trim();

    if(!name || !p1 || !p2 || !gov || !city || !address) {
        alert("من فضلك أكمل كافة الحقول الإلزامية المطلوبة لتوصيل شحنتك البيطرية بدقة!");
        return;
    }

    const btnSubmit = document.getElementById('btnSubmitOrder');
    btnSubmit.innerText = "جاري إرسال الطلب للسيرفر... 🔄";
    btnSubmit.disabled = true;

    const orderId = "VET-" + Math.floor(100000 + Math.random() * 900000);
    
    let itemsSubtotal = 0;
    cart.forEach(item => itemsSubtotal += (item.price * item.quantity));
    let shippingCost = parseFloat(document.getElementById('shippingCost').innerText);
    let discountAmount = itemsSubtotal * couponDiscount;
    let finalTotal = (itemsSubtotal - discountAmount) + shippingCost;
    let shippingCompany = document.getElementById('shippingCompany').innerText;

    // بناء كائن البيانات متوافق 100% مع دالة (submitNewOrder) في السيرفر
    const payload = {
        action: "submitNewOrder", // مطابقة مع السيرفر تماماً
        data: {
            orderId: orderId,
            customerName: name,
            phone1: p1,
            phone2: p2,
            governorate: gov,
            city: city,
            addressDetails: address,
            deliveryDateTime: deliveryTime,
            cart: cart, // السيرفر يتوقع مصفوفة الكائن ليعمل لها stringify بنفسه
            subTotal: itemsSubtotal,
            shippingCost: shippingCost,
            shippingCompany: shippingCompany,
            discount: discountAmount,
            finalTotal: finalTotal
        }
    };

    fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", // لتجنب مشاكل الـ CORS وضمان الإرسال السلس من المتصفح
        body: JSON.stringify(payload)
    })
    .then(() => {
        // الاستجابة في وضع no-cors لا يمكن قراءتها كـ JSON، ولكن وصول العميل لهذه النقطة يعني نجاح الإرسال للسيرفر
        alert(`تم تأكيد طلبك بنجاح ووصوله للصيدلية! \nرقم الطلب الخاص بك هو: ${orderId} \nتم إرساله ومزامنته حياً مع الإدارة بنجاح.`);
        localStorage.removeItem('pharmacy_cart');
        window.location.href = 'store.html';
    })
    .catch(err => {
        alert("حدث خطأ في الاتصال بالشبكة والسيرفر.");
        console.error(err);
        btnSubmit.innerText = "تأكيد وإرسال الطلب";
        btnSubmit.disabled = false;
    });
}
    </script>
</body>
</html>
